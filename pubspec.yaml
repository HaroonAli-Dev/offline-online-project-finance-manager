name: offline_finance_management_app
description: "Offline-first finance and construction management application."
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.2
  drift: ^2.28.0
  path_provider: ^2.1.5
  path: ^1.9.1
  uuid: ^4.5.0
  intl: ^0.20.2
  drift_flutter: ^0.3.1
  sqlite3: ^3.5.1
  shared_preferences: ^2.3.5
  file_picker: ^12.0.0
  image_picker: ^1.1.2
  image: ^4.5.4
  geolocator: ^14.0.2
  flutter_local_notifications: ^19.4.0
  supabase_flutter: ^2.9.0
  pdf: ^3.12.0
  printing: ^5.14.3
  csv: ^8.0.0
  url_launcher: ^6.3.1
  timezone: ^0.10.0
  connectivity_plus: ^6.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  build_runner: ^2.5.0
  drift_dev: ^2.28.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "lib/assests/images/logo/logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "lib/assests/images/logo/logo.png"
  web:
    generate: true
    image_path: "lib/assests/images/logo/logo.png"
    background_color: "#FFFFFF"
    theme_color: "#1B5E20"
  windows:
    generate: true
    image_path: "lib/assests/images/logo/logo.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "lib/assests/images/logo/logo.png"

flutter:
  uses-material-design: true
  assets:
    - lib/assests/images/logo/logo.png
